<script>
/* Stage 1 – animated block diagram of the Proteus simulation */
const S1=id=>{
const box=(x,y,w,h,t1,t2,c='var(--pri)')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--bg)" stroke="${c}" stroke-width="3" class="bx"/><text x="${x+w/2}" y="${y+22}" text-anchor="middle">${t1}</text><text x="${x+w/2}" y="${y+38}" text-anchor="middle" style="font-weight:400;font-size:11px">${t2}</text>`;
let sw='',cells='',leds='';
for(let i=0;i<8;i++){sw+=`<g class="sw" data-i="${i}" style="cursor:pointer"><rect x="${30+i*17}" y="188" width="14" height="34" rx="3" fill="var(--line)" stroke="var(--pri)"/><rect class="knob" x="${32+i*17}" y="206" width="10" height="14" rx="2" fill="var(--mut)"/><text x="${37+i*17}" y="238" text-anchor="middle" style="font-size:9px">D${7-i}</text></g>`;
 cells+=`<rect class="c1" x="${262+i*17}" y="200" width="15" height="22" rx="3" fill="var(--bg)" stroke="var(--pri)"/><text class="t1" x="${269.5+i*17}" y="216" text-anchor="middle" style="font-size:11px">0</text>`;
 cells+=`<rect class="c2" x="${592+i*17}" y="200" width="15" height="22" rx="3" fill="var(--bg)" stroke="var(--pri)"/><text class="t2" x="${599.5+i*17}" y="216" text-anchor="middle" style="font-size:11px">0</text><text x="${599.5+i*17}" y="236" text-anchor="middle" style="font-size:8px">Q${i}</text>`;
 leds+=`<line x1="${599.5+i*17}" y1="250" x2="${599.5+i*17}" y2="315" stroke="var(--mut)" stroke-width="1.5"/><circle class="led" cx="${599.5+i*17}" cy="328" r="9" fill="#333" stroke="var(--mut)"/>`}
return `<div class="card spi" id="${id}"><svg viewBox="0 0 900 370">
${box(20,20,150,64,'NE555 astable clock','R1 1k · R2 6.8k · C2 10µF ≈ 9.9 Hz')}${box(240,20,150,64,'74HC393 counter','Q3 = ÷16 ≈ 0.62 Hz*')}
<line class="w" x1="170" y1="52" x2="240" y2="52" marker-end="url(#a${id})"/>
<line class="w ck" x1="390" y1="52" x2="860" y2="52"/><text x="625" y="42" text-anchor="middle">SCLK (shared shift clock)</text>
<line class="w ck" x1="325" y1="52" x2="325" y2="150"/><line class="w ck" x1="665" y1="52" x2="665" y2="150"/>
<rect x="20" y="150" width="150" height="110" rx="10" fill="var(--bg)" stroke="var(--pri)" stroke-width="3"/><text x="95" y="172" text-anchor="middle">DIP switch ×8</text><text x="95" y="184" text-anchor="middle" style="font-weight:400;font-size:10px">+ 10k pull-downs (click to toggle)</text>${sw}
<line class="w" x1="170" y1="205" x2="250" y2="205" marker-end="url(#a${id})"/><text x="210" y="198" text-anchor="middle" style="font-size:10px">D0–D7</text>
${box(250,150,150,110,'74HC165 (PISO)','parallel-in → serial-out')}<text x="325" y="256" text-anchor="middle" style="font-size:10px">SH/LD = load</text>
<line class="w ser" x1="400" y1="205" x2="590" y2="205" marker-end="url(#a${id})"/><text x="495" y="192" text-anchor="middle">serial data (SO → A,B)  ≙ MOSI</text>
${box(590,150,150,110,'74HC164 (SIPO)','serial-in → parallel-out')}${cells}${leds}
<text x="670" y="360" text-anchor="middle" style="font-size:11px">8 LEDs via 10k resistors (R12–R19)</text>
<text class="dots0" x="0" y="0"></text><g class="dots"></g><text class="st" x="800" y="240" text-anchor="middle" fill="var(--acc)" style="font-size:12px"></text>
<defs><marker id="a${id}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="var(--mut)"/></marker></defs></svg>
<div class="ctrl"><button class="play">▶ Play</button><button class="rst">⟲ Reset</button><label>Speed <input type="range" class="spd" min="300" max="1500" value="800"></label></div>
<div class="msg"></div>
<p class="holds">Cycle: <b>LOAD</b> – switch settings are copied into the 74HC165. Then, on every clock pulse one bit (D7 first) leaves the 165 and enters the 74HC164, which shifts it along Q0→Q7. After 8 pulses the LEDs mirror the switches. *Verify which 74HC393 output drives the clock in your simulation.</p></div>`}
function s1Init(id){const R=document.getElementById(id);if(!R)return;const q=s=>R.querySelector(s),qa=s=>[...R.querySelectorAll(s)];
 let swv=[1,0,1,1,0,0,1,0],r1,r2,step=0,timer=null;const sp=()=>+q('.spd').value;
 const draw=()=>{qa('.sw').forEach(g=>{const i=+g.dataset.i,on=swv[i];g.querySelector('.knob').setAttribute('y',on?190:206);g.querySelector('.knob').setAttribute('fill',on?'#1a9b5b':'var(--mut)')});
  qa('.c1').forEach((c,i)=>{c.setAttribute('fill',r1[i]?'#f5a623':'var(--bg)');qa('.t1')[i].textContent=r1[i]});
  qa('.c2').forEach((c,i)=>{c.setAttribute('fill',r2[i]?'#f5a623':'var(--bg)');qa('.t2')[i].textContent=r2[i]});
  qa('.led').forEach((l,i)=>{l.setAttribute('fill',r2[i]?'#27e07a':'#333');l.style.filter=r2[i]?'drop-shadow(0 0 6px #27e07a)':'none'})};
 const pulse=()=>{qa('.ck').forEach(l=>l.classList.add('on'));setTimeout(()=>qa('.ck').forEach(l=>l.classList.remove('on')),sp()/2)};
 function dot(bit){const d=document.createElementNS('http://www.w3.org/2000/svg','g');d.innerHTML=`<circle r="11" fill="#0b6fd6"/><text text-anchor="middle" y="4" style="fill:#fff">${bit}</text>`;q('.dots').appendChild(d);
  d.animate([{transform:'translate(400px,205px)'},{transform:'translate(590px,205px)'}],{duration:sp()*.8,fill:'forwards',easing:'ease-in-out'}).onfinish=()=>d.remove()}
 function reset(){clearInterval(timer);timer=null;step=0;r1=[0,0,0,0,0,0,0,0];r2=[0,0,0,0,0,0,0,0];q('.st').textContent='';q('.msg').textContent='Idle – toggle the switches, then press Play';q('.play').textContent='▶ Play';q('.dots').innerHTML='';draw()}

p2:CN('A need is stated in terms of what is required, not which circuit solves it. Every design input must carry a unit and a source: measured, datasheet or assumed.')+'<h3>Need statement</h3><p>A digital system must exchange fixed-length words with a peripheral using as few wires as possible, at a controllable rate, sending and receiving at the same time, with the peripheral active only when selected.</p><h3>Design inputs</h3>'+T(['Input','Value','Unit','Source'],[['System clock','50','MHz','assumed (FPGA board)'],['SCLK target','1','MHz','assumed'],['Word length','8','bits','assumed'],['SPI mode','0 (CPOL=0, CPHA=0)','—','assumed'],['Number of slaves','1','—','assumed'],['Logic supply','3.3 / 5','V','datasheet']])+'<h3>Background study</h3><ul><li><b>SPI protocol overview</b> – learned: four wires, master-driven clock, four modes.</li><li><b>74HC165 datasheet</b> – parallel load (SH/LD), serial out on QH, clock inhibit.</li><li><b>74HC164 datasheet</b> – serial in on A·B, parallel out Q0–Q7, master reset.</li><li><b>NE555 / 74HC393</b> – astable timing equation and binary counter dividers.</li></ul><h3>Candidate functional requirements</h3><ol><li>SCLK frequency within ±5 % of target.</li><li>8-bit, MSB-first, full-duplex transfer correct for all 256 words.</li><li>CS low before the first SCLK edge and high after the last.</li></ol>',
p3:CN('Pugh matrix – compare every alternative with a datum concept (here SPI = 0) on weighted criteria: +1 better, 0 same, −1 worse. The highest total is the strongest concept.')+'<h3>Alternatives compared</h3>'+T(['Criterion','Weight','SPI (datum)','I²C','UART','Parallel bus'],[['Speed','3','0','−1','−1','+1'],['Pin count','2','0','+1','+1','−1'],['Full-duplex','2','0','−1','0','−1'],['RTL / FSM effort','2','0','−1','0','+1'],['Multi-slave scalability','1','0','+1','−1','−1'],['Skew robustness at speed','1','0','0','0','−1'],['<b>Weighted total</b>','','<b>0</b>','<b>−4</b>','<b>−2</b>','<b>−1</b>']])+'<h3>Chosen concept and reason</h3><p><b>SPI.</b> Clock-synchronous shifting makes timing simple, it is naturally full-duplex, needs few wires, and maps directly to a shift register + FSM – ideal for a VLSI design and demonstrated already by Stage 1.</p><h3>Scope</h3><p><b>In:</b> Mode-0 master, 8-bit words, one slave, simulation and FPGA. <b>Out:</b> multi-master, DMA, quad-SPI, clocks above 10 MHz.</p>',
p4:CN('A functional requirement is testable: it has a number, a target, a measurement method and a source. Once frozen, any change is dated and explained in the change history.')+T(['FR','Requirement and target','Method','Source','Status','Frozen on'],[['FR1','SCLK frequency = target ± 5 %','Counter in simulation / scope on SCLK','Design input','Draft','—'],['FR2','Mode 0: MOSI changes on falling edge, sampled on rising edge','Waveform check in testbench','SPI mode choice','Draft','—'],['FR3','8-bit MSB-first full-duplex transfer correct for all 256 words','Self-checking loopback testbench','Need statement','Draft','—'],['FR4','CS low ≥ ½ SCLK period before first edge, high after last edge','Timing assertions','Need statement','Draft','—'],['FR5','Idle state: SCLK low, CS high, outputs defined after reset','Reset test','Safe-state rule','Draft','—'],['FR6','Done flag asserted for exactly one transfer','Testbench counter','Interface spec','Draft','—']])+'<h3>Change history</h3><p>— (record date, FR number, what changed, why)</p>',

p6:CN('Every calculation is a card: FR served, equation, values, result and margin – written and dated before the part is bought or the circuit is built.')+'<h3>Calculation card 1 – SCLK divider (FR1)</h3>'+T(['Equation','Values','Result','Margin'],[['N = f_sys / (2·f_SCLK)','f_sys = 50 MHz, f_SCLK = 1 MHz','N = 25','Exact; error 0 %']])+'<h3>Calculation card 2 – Stage 1 clock (NE555 astable)</h3>'+T(['Equation','Values','Result'],[['f = 1.44 / ((R1 + 2·R2)·C)','R1 = 1 kΩ, R2 = 6.8 kΩ, C = 10 µF','f ≈ 9.86 Hz'],['Duty = (R1 + R2) / (R1 + 2·R2)','7.8 kΩ / 14.6 kΩ','≈ 53 %'],['74HC393 Q3 = f / 16','9.86 / 16','≈ 0.62 Hz → 8 bits ≈ 13 s']])+'<p><i>Electrolytic capacitors are typically ±20 %, so expect the measured frequency to differ by that order.</i></p><h3>Component selection</h3>'+T(['Part','Function','Reason'],[['NE555','Astable clock source','Slow visible clock for demonstration'],['74HC393','Binary divider','Slows clock further, shared SCLK'],['74HC165','Parallel-in serial-out','Acts as master shift register'],['74HC164','Serial-in parallel-out','Acts as slave shift register'],['DIP switch ×8 + 10 kΩ','Parallel data and pull-downs','Defined logic 0 when open'],['LED ×8 + 10 kΩ','Output display','Current limiting']])+'<h3>Schematic, constraints, BOM</h3><p>Add the schematic photo below, pin constraints for the FPGA and the BOM table here.</p>',

function spiInit(id,auto){const R=$('#'+id);if(!R)return;let mo=[1,0,1,1,0,0,1,0],so=[0,1,1,0,1,0,0,1],m,s,step=0,timer=null;
 const q=x=>R.querySelector(x),spd=()=>+q('.spd').value,W=(c,on)=>q('.w.'+c).classList.toggle('on',on);
 const reg=(el,a)=>el.innerHTML=a.map(b=>`<span class="b">${b}</span>`).join('');
 const mk=(el,arr)=>{el.innerHTML='';arr.forEach((b,i)=>{const x=document.createElement('button');x.className='bt'+(b?' hi':'');x.textContent=b;x.title='bit '+(7-i)+' (click to flip)';
  x.onclick=()=>{arr[i]^=1;x.textContent=arr[i];x.classList.toggle('hi',!!arr[i]);reset();if(auto)start()};el.appendChild(x)})};
 function wave(k){const x0=70,bw=62,cid='clip'+id;let h=`<defs><clipPath id="${cid}"><rect x="0" y="0" width="${x0+k*bw}" height="190"/></clipPath></defs>`;
  [['SCLK',25],['MOSI',70],['MISO',115],['CS',160]].forEach(r=>h+=`<text x="5" y="${r[1]+5}">${r[0]}</text>`);
  let sc=`M${x0},40`,mp=`M${x0},85`,sp=`M${x0},130`;
  for(let i=0;i<8;i++){const a=x0+i*bw,my=mo[i]?70:85,sy=so[i]?115:130;sc+=`L${a},40L${a},25L${a+bw/2},25L${a+bw/2},40L${a+bw},40`;mp+=`L${a},${my}L${a+bw},${my}`;sp+=`L${a},${sy}L${a+bw},${sy}`;
   h+=`<text x="${a+bw/2-4}" y="62" style="fill:var(--acc)">${mo[i]}</text><text x="${a+bw/2-4}" y="108" style="fill:var(--pri)">${so[i]}</text>`}
  const cp=`M${x0-30},160L${x0},160L${x0},175L${x0+8*bw},175L${x0+8*bw},160L${x0+8*bw+30},160`;
  const P=(d,c,o,cl)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" opacity="${o}" ${cl?`clip-path="url(#${cid})"`:''}/>`;
  [[sc,'#c8102e'],[mp,'#0b6fd6'],[sp,'#e08a00'],[cp,'#1a9b5b']].forEach(a=>h+=P(a[0],a[1],.22,0)+P(a[0],a[1],1,1));
  if(k>0&&k<=8)h+=`<rect x="${x0+(k-1)*bw}" y="10" width="${bw}" height="170" fill="#f5a62333" stroke="#f5a623"/>`;
  q('.wave').innerHTML=h}
 function dot(bit,x1,x2,y,col){const d=document.createElementNS('http://www.w3.org/2000/svg','g');d.innerHTML=`<circle r="12" fill="${col}"/><text text-anchor="middle" y="5" style="fill:#fff">${bit}</text>`;q('.dots').appendChild(d);
  d.animate([{transform:`translate(${x1}px,${y}px)`},{transform:`translate(${x2}px,${y}px)`}],{duration:spd()*.8,fill:'forwards',easing:'ease-in-out'}).onfinish=()=>d.remove()}
 function reset(keep){if(!keep){clearInterval(timer);timer=null;q('.play').textContent='▶ Play'}m=[...mo];s=[...so];step=0;['sclk','mosi','miso','cs'].forEach(c=>W(c,false));q('.dots').innerHTML='';
  reg(q('.mr'),m);reg(q('.sr'),s);q('.st').textContent='Idle: CS = 1 (no slave selected)';q('.msg').textContent=auto?'':'Press ▶ Play, or flip bits to change the waveform';wave(0)}
 function tick(){if(!R.isConnected){clearInterval(timer);return}const msg=q('.msg'),st=q('.st');
  if(step===0){W('cs',true);st.textContent='CS pulled LOW → slave selected';wave(0)}
  else if(step<=8){W('sclk',true);W('mosi',true);W('miso',true);setTimeout(()=>W('sclk',false),spd()/2);dot(m[0],190,570,170,'#0b6fd6');dot(s[0],570,190,230,'#e08a00');
   const a=m[0],b=s[0];m=[...m.slice(1),b];s=[...s.slice(1),a];reg(q('.mr'),m);reg(q('.sr'),s);st.textContent=`SCLK pulse ${step}/8 – bit ${a} → slave, bit ${b} → master`;wave(step)}
  else if(step===9){['sclk','mosi','miso'].forEach(c=>W(c,false));W('cs',false);st.textContent='CS back HIGH → transfer complete';msg.textContent=`Master received 0b${m.join('')}, slave received 0b${s.join('')} ✔`;wave(8)}
  else{if(auto)reset(true);else{clearInterval(timer);timer=null;q('.play').textContent='▶ Play again';reset(true)}step=-1}
  step++}

 q('.play').onclick=()=>{if(timer){clearInterval(timer);timer=null;q('.play').textContent='▶ Resume';return}start()};
 q('.rst').onclick=()=>{reset();if(auto)start()};q('.spd').onchange=()=>{if(timer)start()};
 mk(q('.mb'),mo);mk(q('.sb'),so);reset();if(auto)start()}
